<script>
(() => {
  'use strict';
  const config = window.THEME_CONFIG || {};
  const root = document.documentElement;
  const valid = value => value === 'latte' || value === 'mocha';
  const system = matchMedia('(prefers-color-scheme: dark)');
  const key = 'ctp-theme';
  let saved;
  try { saved = localStorage.getItem(key); } catch (_) {}
  const choose = () => valid(saved) ? saved : valid(config.defaultTheme) ? config.defaultTheme : system.matches ? 'mocha' : 'latte';
  function apply() {
    root.dataset.theme = choose();
    const label = document.querySelector('.ctp-theme');
    if (label) label.textContent = choose() === 'mocha' ? 'Mocha' : 'Latte';
  }
  apply();
  root.dataset.accent = ['blue','teal','lavender'].includes(config.accent) ? config.accent : 'mauve';
  system.addEventListener('change', apply);
  const first = location.pathname.split('/')[1];
  const home = '/' + (first && !['p','articles','category','categories','post-categories','tag','archive','rss'].includes(first) ? first + '/' : '');
  const titles = document.title.split(' - ');
  if (titles[titles.length - 1] === '博客园') titles.pop();
  const name = config.siteName || titles.pop() || '博客';
  function element(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }
  const bar = element('header','ctp-nav');
  const inner = element('div','ctp-nav-inner');
  const brand = element('a','ctp-brand',name);
  brand.href = home;
  const links = element('nav','ctp-nav-links');
  links.setAttribute('aria-label','站点导航');
  const defaults = [ ['首页','/'], ['归档','/p/archive/{ym}'], ['分类','/categories'], ['标签','/tag'] ];
  const items = Array.isArray(config.nav) ? config.nav : defaults.map(([label, href]) => ({ label, href }));
  for (const item of items) {
    if (!item || !item.label || typeof item.href !== 'string') continue;
    if (item.href.includes('{ym}')) {
      const a = element('a','',item.label);
      a.dataset.monthTemplate = item.href; a.setAttribute('aria-disabled','true');
      links.append(a); continue;
    }
    const raw = item.href;
    let url;
    try { url = new URL(raw.startsWith('/') && !raw.startsWith('//') ? home + raw.slice(1) : raw, location.origin + home); } catch (_) { continue; }
    if (!['https:','http:'].includes(url.protocol)) continue;
    const a = element('a','',item.label);
    a.href = url.href;
    if (url.pathname.replace(/\/$/,'') === location.pathname.replace(/\/$/,'') && url.origin === location.origin) a.setAttribute('aria-current','page');
    links.append(a);
  }
  const theme = element('button','ctp-theme',choose() === 'mocha' ? 'Mocha' : 'Latte');
  theme.type = 'button';
  theme.setAttribute('aria-label','切换明暗主题');
  const menu = element('button','ctp-menu','导航');
  menu.type = 'button';
  menu.setAttribute('aria-haspopup','dialog');
  inner.append(brand, links, theme, menu);
  bar.append(inner);
  document.write(bar.outerHTML);
  if (config.favicon) {
    const icon = element('link');
    icon.rel = 'icon'; icon.href = config.favicon;
    document.head.querySelectorAll('link[rel~="icon"]').forEach(node => node.remove());
    document.head.append(icon);
  }
  window.CTP = { home, config, toggleTheme() {
    saved = choose() === 'mocha' ? 'latte' : 'mocha';
    try { localStorage.setItem(key, saved); } catch (_) {}
    apply();
  }};
  setTimeout(() => root.classList.add('ctp-ready'), 1500);
})();
</script>
<script>
(() => {
  const sources = ['https://cdn.jsdelivr.net/gh/example/ctp-docs@v1.0.0/dist/', 'https://fastly.jsdelivr.net/gh/example/ctp-docs@v1.0.0/dist/'];
  const key = 'ctp:cdn-until:' + sources[0];
  const now = Date.now();
  const hour = new Date(now).toISOString().slice(0,13).replace(/[-T]/g,'');
  const url = (host, asset) => sources[host] + asset + '?d=' + hour;
  let first = 0;
  try { if (Number(localStorage.getItem(key)) > now) first = 1; } catch (_) {}
  function trip() {
    try { localStorage.setItem(key, String(Date.now() + 3600000)); } catch (_) {}
  }
  window.CTP.stylesLoaded = new Promise(done => {
    if (getComputedStyle(document.documentElement).getPropertyValue("--ctp-field").trim() === "1") { done(true); return; }
    function style(host) {
      const link = document.createElement('link');
      link.rel = 'stylesheet'; link.href = url(host, 'ctp-docs.min.css');
      link.onload = () => done(true);
      link.onerror = () => {
        if (host === 0) { trip(); style(1); } else done(false);
      };
      document.head.append(link);
    }
    style(first);
  });
  if (first === 0) {
    document.addEventListener('error', function retry(event) {
      if (event.target.id !== 'ctp-runtime') return;
      document.removeEventListener('error', retry, true);
      trip();
      const script = document.createElement('script');
      script.src = url(1, 'ctp-docs.js'); document.head.append(script);
    }, true);
  }
  document.write('\x3cscr' + 'ipt defer id="ctp-runtime" src="' + url(first, 'ctp-docs.js') + '"\x3e\x3c/scr' + 'ipt\x3e');
})();
</script>
